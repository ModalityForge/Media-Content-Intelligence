# Author: Prosenjit Banerjee <prosenjit.banerjee@gmail.com>

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=media-content-intelligence
      - ENVIRONMENT=local
      - OBJECT_STORE_PATH=/data/raw
      - SOCIAL_MEDIA_STORE_PATH=/data/restricted/social_media_influencer
      - ENABLE_MOCK_MODELS=true
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
      - ./logs:/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
