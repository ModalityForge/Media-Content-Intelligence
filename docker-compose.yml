version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=media-content-intelligence-mci-v2
      - ENVIRONMENT=local
      - VECTOR_DB_URL=http://localhost:6333
      - METADATA_DB_URL=sqlite:///mci.db
      - REDIS_URL=redis://redis:6379/0
      - OBJECT_STORE_PATH=/data/raw
      - ENABLE_MOCK_MODELS=true
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
      - ./logs:/logs
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional: Qdrant vector DB (commented out for local dev)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"

  # Optional: Prometheus (commented out for local dev)
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # Optional: Grafana (commented out for local dev)
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"

volumes:
  redis_data: