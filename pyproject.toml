# Minimal public inference package.
# Author: Prosenjit Banerjee <prosenjit.banerjee@gmail.com>
[project]
name = "media-content-intelligence"
version = "2.0.0"
description = "Explainable local-media retrieval with deterministic agent orchestration and evidence validation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Prosenjit Banerjee", email = "prosenjit.banerjee@gmail.com"}
]
keywords = ["video", "media", "intelligence", "RAG", "search", "OTT", "broadcast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "rank-bm25>=0.2.2",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
