[project]
name = "media-content-intelligence-mci-v2"
version = "2.0.0"
description = "MCI-v2.0: Media Content Intelligence platform for broadcast, OTT, sports, brand safety, semantic video retrieval, rights-aware retrieval, and clip review."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MCI Team", email = "team@mediacontentintelligence.io"}
]
keywords = ["video", "media", "intelligence", "RAG", "search", "OTT", "broadcast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "rank-bm25>=0.2.2",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "streamlit>=1.30.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
langgraph = [
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
]
models = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "opencv-python>=4.9.0",
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=0.10.0",
    "easyocr>=1.7.0",
]
vector-db = [
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"