<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Media Intelligence Architecture</title>
  <desc id="architecture-desc">Four aligned layers connect the Streamlit and FastAPI experience, query orchestration, deterministic metadata and BM25 retrieval with Reciprocal Rank Fusion, and evidence governance with a human-review signal. Dashed lines connect each layer to a shared observability rail for trace IDs, structured logs, metrics, and feedback. A solid arrow carries evidence and provenance to ranked, explainable media results. The diagram describes a mock-first reference application.</desc>
